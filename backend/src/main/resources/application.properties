# Render gives the port in the PORT variable
server.port=${PORT:8080}

# Database settings come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Keep the pool small for Neon's free plan
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.monthly-budget=20000